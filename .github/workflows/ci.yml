name: ORCA CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend Test Suite (FastAPI + Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/api/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt

      - name: Run backend pytest suite
        working-directory: services/api
        env:
          PYTHONPATH: .
          ENVIRONMENT: "test"
          SUPABASE_JWT_SECRET: "ci-test-jwt-secret-key-32charslong!"
          ADMIN_EMAIL: "admin@gmail.com"
          ADMIN_PASSWORD: "CiTestPassword123!"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          TESTING: "true"
        run: |
          pytest tests -q --durations=10

  frontend-lint-and-build:
    name: Frontend Lint & Build (Next.js 16 + TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run route type generation and strict typecheck
        run: npm run lint

      - name: Compile production build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_SUPABASE_URL: "https://mock-supabase-ci.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key-for-ci-building-purpose"
        run: npm run build
