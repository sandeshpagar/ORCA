version: "3.8"

services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: orca-backend-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - WEB_CONCURRENCY=4
      - FRONTEND_URL=http://localhost:3000
      - DATABASE_URL=sqlite+aiosqlite:///./orca_local.db
      - SUPABASE_URL=${SUPABASE_URL:-https://demo-orca.supabase.co}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-demo-anon-key}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-demo-service-key}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-production-jwt-secret-min-32-chars-long-orca}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@isro.gov.in}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-StrongAdminPass2026!}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_DAILY_LIMIT_PER_USER=50
      - LOG_FORMAT=json
      - SENTRY_DSN=${SENTRY_DSN:-}
    volumes:
      - orca_db_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - orca-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orca-web-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:8000
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-https://demo-orca.supabase.co}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-demo-anon-key}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - orca-network

volumes:
  orca_db_data:
    driver: local

networks:
  orca-network:
    driver: bridge
